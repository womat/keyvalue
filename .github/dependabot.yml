# keyvalue has no dependencies outside the standard library, so dependabot
# only watches the actions in the CI workflow. It does not see the tools
# pinned with "go install" there (golangci-lint, govulncheck); those are
# bumped by hand. To switch this off, delete this file. The CI workflow does
# not depend on it.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
